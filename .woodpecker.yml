kind: pipeline
type: docker
name: rust-ci

trigger:
  branch:
    - main
    - master
  event:
    - push
    - pull_request

steps:
  - name: check
    image: rust:latest
    commands:
      - rustup component add clippy rustfmt
      - cargo check --all-targets --all-features

  - name: clippy
    image: rust:latest
    commands:
      - rustup component add clippy
      - cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery

  - name: format
    image: rust:latest
    commands:
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: test
    image: rust:latest
    commands:
      - cargo test --all-targets --all-features
