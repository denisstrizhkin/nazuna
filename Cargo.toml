[package]
name = "nazuna"
version = "0.1.0"
edition = "2024"
description = "A minimalist, purely data-driven management tool for WireGuard 🩸"
repository = "https://github.com/denisstrizhkin/nazuna"
license = "MIT"
keywords = ["config", "management", "vpn", "wg", "wireguard"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive", "env"] }
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
